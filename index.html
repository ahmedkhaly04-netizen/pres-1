<dialog id="panel"><button class="close" aria-label="إغلاق">✕</button><div id="panelbody"></div></dialog><script>const slides = [
{title:'أمن المعلومات<br>والأمن السحابي',tag:'من حماية المعلومة إلى حماية السحابة',desc:'البيانات تتحرك. المسؤولية تبقى.',points:['أحمد · آدم · عبدالله | 12 شريحة','رحلة من المبادئ إلى تطبيق عملي'],type:'hero',notes:`أهلًا بكم. عرضنا اليوم عن أمن المعلومات والأمن السحابي. تخيلوا أن نظام الجامعة يحتوي على درجات الطلاب وملفاتهم، ويعمل على خدمة سحابية. ماذا يحدث لو قرأ شخص غير مخوّل الدرجات، أو عدّلها، أو توقف النظام أثناء التسجيل؟ هذه ثلاثة أنواع مختلفة من الضرر، وكلها تدخل ضمن أمن المعلومات. هدفنا أن نفهم ماذا نحمي، وما التهديدات، وكيف تتوزع المسؤولية عندما نستخدم السحابة. سنعرض أيضًا سيناريو تعليميًا نطبّق فيه هذه المفاهيم. أنا سأشرح الأساسيات في أول أربع شرائح، ثم ينتقل آدم إلى السحابة، ويختم عبدالله بالضوابط والتطبيق. الحركات الموجودة في العرض نماذج توضيحية وليست اتصالات أو هجمات حقيقية.`},
{title:'ما الذي نحميه؟',tag:'01 / أساسيات أمن المعلومات',desc:'أمن المعلومات يحمي البيانات في أي شكل: رقمي، ورقي، أو شفهي.',points:['البيانات: درجات، هويات، أبحاث','الأصول: أجهزة، تطبيقات، حسابات','الهدف: تقليل المخاطر إلى مستوى مقبول'],type:'assets',notes:`أمن المعلومات أوسع من حماية جهاز الكمبيوتر. المعلومة قد تكون ملفًا على خادم، ورقة في مكتب، أو معلومة تُقال في مكالمة. لذلك تبدأ الحماية بتحديد الأصول: ما الذي نملكه، ومن يستخدمه، وما قيمة فقدانه؟ في الجامعة تشمل الأصول سجلات الطلاب وأبحاث الأساتذة والحسابات ونظام التسجيل. نحتاج كذلك لتصنيف البيانات: عامة، داخلية، أو حساسة، ثم تحديد من يحق له الوصول إليها. أما الأمن السيبراني فيركّز عادة على حماية الأنظمة والشبكات والبيانات الرقمية. المصطلحان متداخلان، لكن أمن المعلومات يشمل الأشكال غير الرقمية أيضًا. لا يوجد أمن كامل؛ المطلوب إدارة المخاطر مع مراعاة التكلفة وسهولة الاستخدام. حركة انتقال الملفات هنا تذكّرنا بأن الحماية يجب أن تستمر أثناء التخزين والنقل والاستخدام، وليس فقط عند حفظ الملف.`},
{title:'ثلاثة أهداف.<br>حماية واحدة.',tag:'02 / مثلث CIA',desc:'السرّية، السلامة، والتوافر هي أساس تقييم الحماية.',points:['Confidentiality · السرّية: القراءة للمصرّح لهم','Integrity · السلامة: منع التعديل غير المصرّح','Availability · التوافر: الخدمة عند الحاجة'],type:'cia',notes:`يعتمد أمن المعلومات على ثلاثة أهداف تُعرف بمثلث CIA. السرية تعني أن المعلومة لا يطّلع عليها إلا من يملك صلاحية. مثلًا، الطالب يرى درجاته وحده. السلامة تعني حماية البيانات من التعديل أو الإتلاف غير المصرّح به؛ فيجب ألا يستطيع طالب تغيير درجته، كما يجب أن تكون التعديلات المصرّح بها قابلة للتتبع. التوافر يعني أن المستخدم المصرّح له يستطيع الوصول للخدمة عند الحاجة، خصوصًا وقت التسجيل. اضغطوا على كل ضلع لتروا نوع الحماية. التشفير وضبط الوصول يدعمان السرية، والتحقق من التغييرات والسجلات يدعمان السلامة، والنسخ الاحتياطية والتكرار يدعمان التوافر. هذه أمثلة وليست حدودًا منفصلة؛ الضابط الواحد قد يخدم أكثر من هدف. وأحيانًا توجد مفاضلة: تشديد الوصول دون تخطيط قد يمنع المستخدمين الحقيقيين، لذلك نحتاج حماية مناسبة للغرض.`},
{title:'كيف يتحوّل الضعف<br>إلى خطر؟',tag:'03 / تهديد × ثغرة × أثر',desc:'نفهم الخطر قبل أن نختار أداة الحماية.',points:['التهديد: تصيّد أو برمجية خبيثة أو خطأ بشري','الثغرة: إعداد خاطئ أو كلمة مرور ضعيفة','الأثر: تسريب أو تعديل أو توقف'],type:'risk',notes:`التهديد هو مصدر محتمل للضرر، مثل مهاجم أو برنامج خبيث أو خطأ من موظف. الثغرة هي نقطة ضعف يمكن أن يستغلها هذا التهديد، مثل كلمة مرور ضعيفة أو خدمة مكشوفة. الخطر يرتبط باحتمال حدوث الضرر وحجم أثره؛ لا نستخدم هنا معادلة رقمية، بل تسلسلًا توضيحيًا. المثال: تصل رسالة تصيّد تشبه بريد الجامعة، ويدخل المستخدم كلمة مروره في صفحة مزيفة، ثم يستخدم المهاجم الحساب للوصول للبيانات. الحماية لا تعتمد على التدريب وحده: يمكن دعمها بمصادقة متعددة العوامل مقاومة للتصيّد، وصلاحيات محدودة، وتنبيهات لتسجيل الدخول غير المعتاد. وفي الفدية، النسخة الاحتياطية تساعد على التعافي إذا كانت منفصلة ومختبرة. الخلاصة أن امتلاك أداة أمنية لا يكفي؛ نختار الضابط بعد فهم التهديد والثغرة والأثر. بهذا ننتقل من الأساسيات إلى سؤال آدم: ماذا يتغير عندما تكون أنظمتنا في السحابة؟`},
{title:'السحابة تغيّر التشغيل.<br>ولا تلغي الأمن.',tag:'04 / نماذج الخدمات السحابية',desc:'كلما زادت الخدمة المُدارة، قلّت المكوّنات التي تديرها بنفسك.',points:['IaaS: تدير النظام والتطبيق على بنية مستأجرة','PaaS: تنشر التطبيق على منصة مُدارة','SaaS: تستخدم تطبيقًا جاهزًا'],type:'models',notes:`الحوسبة السحابية تتيح الحصول على موارد وخدمات عبر الشبكة حسب الحاجة. سنركز على ثلاثة نماذج. في IaaS، أو البنية التحتية كخدمة، تحصل على موارد مثل آلة افتراضية، وتدير غالبًا نظام التشغيل وتحديثاته وتطبيقك. في PaaS، أو المنصة كخدمة، يدير المزوّد أجزاء أكبر من المنصة، بينما تركز أنت على التطبيق والبيانات والإعدادات التي تملكها. في SaaS، أو البرمجيات كخدمة، تستخدم تطبيقًا جاهزًا مثل البريد المؤسسي. اختاروا النموذج لتروا اختلاف الطبقات في الرسم. هذا تبسيط؛ التفاصيل تعتمد على الخدمة والعقد. تختلف نماذج الخدمة عن نماذج النشر، مثل السحابة العامة والخاصة والهجينة. ميزات السحابة تشمل سرعة توفير الموارد والمرونة والخدمات المدارة، لكن الإعدادات الخاطئة يمكن أيضًا أن تتوسع بسرعة. لذلك لا يكفي أن نقول إن المزوّد شركة كبيرة؛ علينا معرفة مسؤوليتنا داخل الخدمة.`},
{title:'من المسؤول<br>عن ماذا؟',tag:'05 / المسؤولية المشتركة',desc:'المزوّد يؤمّن البنية؛ والعميل يؤمّن ما يتحكّم فيه.',points:['المزوّد: مراكز البيانات والبنية الأساسية','العميل: البيانات والهويات وإعدادات الوصول','التوزيع التفصيلي يتغيّر حسب الخدمة'],type:'shared',notes:`المسؤولية المشتركة هي أهم فكرة في الأمن السحابي. المزوّد مسؤول عن حماية البنية التي يقدمها، مثل مركز البيانات والأجهزة وطبقة الافتراضية بحسب الخدمة. العميل مسؤول عن بياناته وهوياته وصلاحياته وإعداداته التي يتحكم فيها. في الآلة الافتراضية، مثلًا، يكون تحديث نظام التشغيل الضيف وتطبيقاته من مسؤوليات العميل عادة. في الخدمة المدارة يتحمل المزوّد بعض هذه المهام، لكن العميل لا يتخلى عن مسؤولية منح الوصول الصحيح وحماية المعلومات. المخطط الذي أمامنا تبسيطي، لذلك يجب مراجعة توثيق الخدمة الفعلية. مثال مهم: لو جعلنا مساحة تخزين متاحة للجميع، فوجود مركز بيانات آمن لا يمنع قراءة الملفات المسموح بها علنًا. الخطأ هنا في سياسة الوصول. المسؤولية المشتركة لا تعني أن كل جانب يحمي نصف البيانات؛ إنها توزيع للمهام، وقد تتداخل بعض المهام وتحتاج تنسيقًا واضحًا.`},
{title:'الهوية هي<br>بوابة السحابة.',tag:'06 / IAM وZero Trust',desc:'تحقّق من الهوية، وحدّد الصلاحية، وراجع السياق.',points:['MFA: أكثر من دليل لإثبات الهوية','أقل صلاحية: ما تحتاجه المهمة فقط','Zero Trust: لا ثقة ضمنية بسبب موقع الشبكة'],type:'identity',notes:`في السحابة يمكن الوصول للخدمات عن بعد، ولذلك تصبح الهوية محورًا أساسيًا للحماية. المصادقة تسأل: من أنت؟ والتفويض يسأل: ماذا يُسمح لك أن تفعل؟ نجاح تسجيل الدخول لا يعني السماح بكل العمليات. في المثال، الطالب يستطيع قراءة ملفه، لكنه لا يستطيع تعديل الدرجة. نطبق أقل صلاحية، ونفصل حساب الإدارة عن الاستخدام اليومي، ونراجع الصلاحيات دوريًا. المصادقة متعددة العوامل تضيف دليلًا آخر، لكن ليست كل وسائلها بنفس القوة؛ بعض الوسائل قد تتأثر بالتصيّد، بينما توفر مفاتيح الأمان أو وسائل مقاومة للتصيّد حماية أفضل عند دعمها. Zero Trust ليس اسم منتج، ولا يعني منع الجميع؛ هو منهج يمنع منح الثقة تلقائيًا بسبب وجود المستخدم داخل الشبكة، ويفحص الهوية والجهاز والسياق وفق السياسة. تجربة السماح والرفض توضح أن القرار يجب أن يرتبط بالطلب، لا بمجرد امتلاك الحساب.`},
{title:'البيانات تحتاج حماية<br>في كل محطة.',tag:'07 / التشفير وإدارة المفاتيح',desc:'التشفير يجعل المحتوى غير مقروء دون المفتاح المناسب.',points:['أثناء النقل: قنوات مشفّرة مثل TLS','أثناء التخزين: تشفير الملفات وقواعد البيانات','المفاتيح: وصول محدود وتدوير وفق السياسة'],type:'encryption',notes:`تمر البيانات بمراحل: تنتقل عبر الشبكة، وتُخزّن على وسيط، ثم يستخدمها التطبيق. أثناء النقل نستخدم قنوات مشفرة مثل TLS، وأثناء التخزين نستخدم تشفيرًا مناسبًا للملفات أو الأقراص أو قواعد البيانات. اضغطوا زر التشفير لتحويل عبارة مفهومة إلى رموز؛ هذه محاكاة بصرية وليست خوارزمية تشفير حقيقية. التشفير الحقيقي يعتمد على خوارزميات ومفاتيح معتمدة. لكن التشفير ليس بديلًا لضبط الوصول؛ إذا كان حساب مخوّل يستطيع قراءة البيانات، فقد يتمكن من فكها بصورة طبيعية. لذلك إدارة المفاتيح مهمة: من يستطيع استخدامها، وكيف تُحفظ، وكيف تُراجع وتُدوّر وفق السياسة؟ لا نضع المفاتيح وكلمات المرور داخل الشيفرة المنشورة. كذلك التشفير لا يحمي تلقائيًا البيانات أثناء استخدامها، فذلك يحتاج تصميمًا وضوابط إضافية بحسب الحالة. والنسخة الاحتياطية ليست مجرد ملف موجود؛ يجب اختبار إمكانية استعادتها. الآن ينتقل عبدالله إلى بناء دفاع متكامل وتطبيقه.`},
{title:'دفاع على طبقات.',tag:'08 / تقليل فرص الاختراق والأثر',desc:'كل طبقة تضيف حماية عندما تفشل طبقة أخرى.',points:['الهوية: MFA وصلاحيات محدودة','الشبكة والتطبيق: عزل وتحديث وضبط الوصول','البيانات والمراقبة: تشفير وسجلات ونسخ مختبرة'],type:'layers',notes:`الدفاع متعدد الطبقات يعني ألا نربط حماية النظام بضابط واحد. تبدأ الطبقات بالهوية، ثم الشبكة والتطبيق والبيانات والمراقبة والتعافي. نقلل الخدمات المكشوفة، ونستخدم قواعد شبكة مناسبة، ونحدّث المكونات التي نديرها، ونفصل البيئات عند الحاجة. قد يساعد جدار حماية تطبيقات الويب في بعض الهجمات على التطبيق، لكنه لا يصلح كل أخطاء التطبيق ولا يغني عن كتابة آمنة. تراقب السجلات من دخل وما الذي تغير، وتساعد التنبيهات على اكتشاف النشاط غير المتوقع. تُظهر الحركة طلبًا يعبر طبقات الفحص أو يُمنع، لكن الواقع ليس سلسلة ثابتة لكل طلب؛ الرسم لتوضيح تكامل الضوابط. كذلك نراقب التغييرات في إعدادات السحابة، لأن حسابًا بصلاحيات واسعة قد يجعل موردًا حساسًا مكشوفًا. الهدف ليس تكديس المنتجات، بل اختيار ضوابط مناسبة، معرفة صاحب كل ضابط، والتحقق من أنه يعمل.`},
{title:'سيناريو: ملفات الجامعة<br>أصبحت مكشوفة.',tag:'09 / تمرين تعليمي تفاعلي',desc:'مساحة تخزين تجريبية تسمح بقراءة ملفات حساسة للجميع.',points:['اكتشف: تنبيه عن تغيير سياسة الوصول','احتوِ: أغلق الوصول العام وافحص الصلاحيات','تعافَ: قيّم الأثر وعالج السبب وراقب'],type:'incident',notes:`هذا مثال افتراضي للتعلم، وليس حادثًا حقيقيًا في جامعتنا. لدينا مساحة تخزين سحابية تحتوي على ملفات طلاب، وتغيرت سياسة الوصول لتسمح بالقراءة العامة. اضغطوا خطوات السيناريو. أولًا نكتشف المشكلة من تنبيه على تغيير الإعدادات أو مراجعة أمنية. ثانيًا نحتوي الضرر بإيقاف الوصول العام والتحقق من الحسابات والصلاحيات، مع حفظ الأدلة والسجلات المتاحة. إذا كانت هناك بيانات اعتماد مكشوفة، نلغيها أو ندوّرها حسب الحالة. ثالثًا نحدد نطاق التأثر: أي ملفات كانت متاحة، وما الفترة، وهل توجد سجلات وصول؟ قد لا تكفي السجلات لإثبات أن أحدًا لم يقرأ البيانات. ثم نعالج السبب الجذري، مثل صلاحية زائدة أو إعداد غير مراجع، وننسق مع المسؤولين بشأن الإبلاغ وفق الالتزامات المعمول بها. النسخة الاحتياطية تساعد إذا تلفت البيانات، لكنها لا تلغي تسريبًا حدث. حركة إغلاق المسار تعبر عن احتواء الوصول؛ لا تعني استرجاع بيانات سبق نسخها.`},
{title:'الأمن عملية مستمرة.',tag:'10 / إطار NIST CSF 2.0',desc:'ست وظائف تربط القرارات والضوابط والاستجابة.',points:['Govern · الحوكمة: المسؤوليات والسياسات','Identify / Protect / Detect · اعرف واحمِ واكتشف','Respond / Recover · استجب واستعد'],type:'cycle',notes:`يوفر إطار NIST CSF 2.0 طريقة لتنظيم إدارة المخاطر السيبرانية حول ست وظائف. الحوكمة تحدد السياسات والمسؤوليات وأولويات المخاطر. التحديد يعني معرفة الأصول والاعتماديات والمخاطر. الحماية تشمل الضوابط التي تقلل الضرر. الكشف يهدف إلى اكتشاف وتحليل الأحداث المحتملة. الاستجابة تشمل إدارة الحادث واحتواء أثره والتواصل المناسب. والتعافي يعيد الخدمات والقدرات المتأثرة. دوران المؤشر يوضح أن الأمن يُراجع باستمرار، لكن الوظائف ليست خطوات ننجزها مرة واحدة بالترتيب؛ بعضها يعمل بالتوازي، والاستجابة والتعافي يحتاجان استعدادًا مسبقًا. نربط هذا بالجامعة: من يملك قرار منح الوصول؟ ما البيانات الحساسة؟ من يستقبل التنبيه؟ وهل جرّبنا استعادة النظام؟ الإطار لا يقدم وصفة واحدة ولا شهادة أمان؛ يساعد على تنظيم العمل ومقارنة الوضع الحالي بالهدف المطلوب. وبعد كل تمرين أو حادث نستخدم الدروس لتحسين الضوابط.`},
{title:'السحابة الآمنة تبدأ<br>بقرارات واضحة.',tag:'11 / الخلاصة والمناقشة',desc:'اعرف بياناتك. اضبط الوصول. اختبر التعافي.',points:['حدّد الأصول والمسؤوليات','طبّق أقل صلاحية والتشفير والمراقبة','سؤال: هل التشفير وحده يمنع تسريب الملفات؟'],type:'quiz',notes:`نختم بثلاث رسائل. أولًا، نحمي السرية والسلامة والتوافر، وليس مجرد جهاز أو كلمة مرور. ثانيًا، السحابة توزّع المسؤوليات ولا تلغي مسؤولية العميل عن البيانات والهوية والإعدادات التي يملكها. ثالثًا، الحماية تحتاج ضوابط متكاملة ومراقبة واستجابة وتعافيًا مختبرًا. سؤالنا للجمهور: هل تشفير الملفات وحده يمنع تسريبها؟ الإجابة لا؛ لأن الحساب المخوّل قد يقرأها بعد فك التشفير، أو قد تسمح خدمة التطبيق بتنزيلها وفق سياسة وصول خاطئة. لذلك نحتاج التشفير مع ضبط الهوية والصلاحيات ومراجعة الإعدادات. وإذا سأل أحد هل السحابة أكثر أمانًا من النظام المحلي، فالإجابة تعتمد على الخدمة والتصميم وطريقة التشغيل، وليس الموقع وحده. وإذا سأل عن أفضل إجراء أولي، فنبدأ بمعرفة الأصول والمسؤوليات ثم حماية الحسابات والصلاحيات الحساسة. المراجع الرسمية موجودة في لوحة المصادر ويمكن الرجوع إليها بعد العرض. شكرًا لكم، ونرحب بأسئلتكم.`}
];

document.addEventListener('keydown',e=>{if($('#panel').open)return;if(['ArrowLeft','PageDown',' '].includes(e.key)){e.preventDefault();go(index+1)}if(['ArrowRight','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}if(e.key==='Home')go(0);if(e.key==='End')go(11);if(e.key.toLowerCase()==='n')$('#notes').click();if(e.key.toLowerCase()==='f')full()});window.addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1))||1)-1));let sx;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if($('#panel').open||sx===undefined)return;let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>90)go(index+(dx>0?1:-1));sx=undefined},{passive:true});
let canvas=$('#bg'),ctx=canvas.getContext('2d'),dots=Array.from({length:36},()=>({x:Math.random(),y:Math.random(),r:Math.random()*2+1,v:Math.random()*.00006+.000015}));function resize(){canvas.width=innerWidth;canvas.height=innerHeight}window.addEventListener('resize',resize);resize();function draw(){requestAnimationFrame(draw);if(paused&&frame>0)return;frame++;ctx.clearRect(0,0,canvas.width,canvas.height);let light=document.body.classList.contains('light');dots.forEach((p,i)=>{if(!paused)p.y=(p.y-p.v+1)%1;let x=p.x*canvas.width,y=p.y*canvas.height;ctx.fillStyle=light?'#007c6944':'#5ef2d266';ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fill();for(let j=i+1;j<dots.length;j++){let q=dots[j],dx=x-q.x*canvas.width,dy=y-q.y*canvas.height;if(dx*dx+dy*dy<18000){ctx.strokeStyle=light?'#007c6911':'#5ef2d214';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(q.x*canvas.width,q.y*canvas.height);ctx.stroke()}}});}render();draw();

let pointerFrame=0;document.addEventListener('pointermove',e=>{if(paused||reduced||e.pointerType==='touch')return;if(pointerFrame)return;pointerFrame=requestAnimationFrame(()=>{pointerFrame=0;const scene=document.querySelector('.scene3d');if(scene){scene.style.setProperty('--tilt-x',((e.clientY/innerHeight-.5)*-12)+'deg');scene.style.setProperty('--tilt-y',((e.clientX/innerWidth-.5)*16)+'deg')}})});
</script></body></html>
